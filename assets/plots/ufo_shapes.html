<!DOCTYPE html>
<html>
<head>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-a62a1800beacf9436354b9f894d3c9a8"}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "reports", "legend": null, "scale": {"scheme": "blues"}, "type": "quantitative"}, "tooltip": [{"field": "shape", "title": "Shape", "type": "nominal"}, {"field": "reports", "format": ",d", "title": "Reports", "type": "quantitative"}], "x": {"field": "reports", "title": "Number of reported sightings", "type": "quantitative"}, "y": {"field": "shape", "sort": "-x", "title": "Reported shape", "type": "nominal"}}, "height": 350, "title": "Top 10 Reported UFO Shapes", "width": 600, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-a62a1800beacf9436354b9f894d3c9a8": [{"shape": "light", "reports": 16565}, {"shape": "triangle", "reports": 7865}, {"shape": "circle", "reports": 7608}, {"shape": "fireball", "reports": 6208}, {"shape": "other", "reports": 5649}, {"shape": "unknown", "reports": 5584}, {"shape": "sphere", "reports": 5387}, {"shape": "disk", "reports": 5213}, {"shape": "oval", "reports": 3733}, {"shape": "formation", "reports": 2457}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'

                          + "<p>This usually means there's a typo in your chart specification. "

      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
