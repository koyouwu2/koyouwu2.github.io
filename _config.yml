
### Site Settings ###
title: "Koyou Wu | Portfolio"

description: >-
  MSIM student at the University of Illinois Urbana-Champaign,
  with a background in Visual Communication Design and
  Computer Information Systems. Passionate about data
  visualization, UX/UI design, and information management.

baseurl: ""
repository: "koyouwu2/koyouwu2.github.io"
open_new_tab: false


### Plugins ###
plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-paginate-v2
  - mini_magick


### Local Server ###
port: 4008


### Navbar Settings ###
nav_exclude:
  - pages/tags.html
  - pages/404.html
  - pages/index.md
  - documentation/partials/**
  - pages/blog.html


### Author Info ###
### Author Info ###
author:
  name: "Koyou Wu"
  image: "https://github.com/koyouwu2.png"
  github: "koyouwu2"
  
  # Add your contact information when ready:
  # email: "your-email@example.com"
  # linkedin: "your-linkedin-username"
  # behance: "your-username"
  # instagram: "your-username"


### Posts ###
permalink: /blog/:title


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name

  elements:
    output: true


### Disqus ###
disqus:
  shortname: your-short-name-disqus


### Analytics ###
analytics:
  enabled: false
  google:
    tracking_id: your-google-tracking-id


### Buy Me a Coffee ###
buymeacoffee:
  enabled: false
  username: your_username
  color: "#007bff"
  message: "Thank you for visiting."
  description: "Support me on Buy me a coffee!"


### Defaults for Collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"

  - scope:
      path: ""
      type: "elements"
    values:
      layout: "element"

  - scope:
      path: ""
      type: "posts"
    values:
      comments: false


### Exclude from Processing ###
exclude:
  - README.md
  - README.md~
  - CONTRIBUTING.md
  - LICENSE.md
  - LICENSE.md~
  - config.yml~
  - "*.log"
  - "*.ipynb"
  - "python_notebooks/*"
  - vendor
  - Gemfile
  - Gemfile.lock
